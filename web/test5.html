<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>सत्यानुसरण Poster</title>


<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;
    user-select:none;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    padding:15px;

    font-family:
        "Noto Serif Devanagari",
        "Nirmala UI",
        serif;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(255,255,255,.95),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(255,183,77,.25),
            transparent 32%
        ),
        linear-gradient(
            145deg,
            #fffdf7 0%,
            #fff3dc 50%,
            #ffe0b2 100%
        );

}


/* =========================
   POSTER
========================= */

.poster{

    width:100%;

    max-width:600px;

    aspect-ratio:1 / 1;

    margin:0 auto;

    position:relative;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:45px 35px;


    background:

        radial-gradient(
            circle at 18% 12%,
            rgba(255,255,255,.98),
            transparent 27%
        ),

        radial-gradient(
            circle at 88% 88%,
            rgba(255,183,77,.22),
            transparent 30%
        ),

        linear-gradient(
            145deg,
            #fffef9,
            #fff4df
        );


    border:5px solid #8d3b00;

    border-radius:30px;


    box-shadow:

        0 18px 45px
        rgba(78,52,46,.25);

}


/* Inner border */

.poster::before{

    content:"";

    position:absolute;

    inset:13px;

    border:2px solid #d68b00;

    border-radius:20px;

    pointer-events:none;

}


/* Decorative top circle */

.poster::after{

    content:"";

    position:absolute;

    width:180px;

    height:180px;

    right:-90px;

    top:-90px;

    border-radius:50%;

    background:
        rgba(255,183,77,.16);

    pointer-events:none;

}


/* =========================
   SMALL LABEL
========================= */

.label{

    position:relative;

    z-index:2;

    margin-bottom:20px;

    padding:7px 17px;

    border-radius:30px;

    background:
        rgba(255,152,0,.12);

    border:
        1px solid
        rgba(230,81,0,.25);

    color:#e65100;

    font-size:14px;

    font-weight:bold;

}


/* =========================
   QUOTE
========================= */

.quote{

    position:relative;

    z-index:2;

    margin:0;

    max-width:90%;

    color:#302015;

    font-size:clamp(
        22px,
        5vw,
        38px
    );

    line-height:1.75;

    font-weight:bold;

}


/* Quote marks */

.quote-mark{

    color:#ef6c00;

    font-size:1.4em;

    line-height:.5;

    vertical-align:-5px;

}


/* =========================
   AUTHOR
========================= */

.author{

    position:relative;

    z-index:2;

    margin-top:25px;

    padding-top:13px;

    border-top:
        1px solid
        rgba(121,85,72,.25);

    color:#9b3d00;

    font-size:19px;

    font-weight:bold;

}


/* =========================
   WATERMARK
========================= */

.watermark{

    position:absolute;

    z-index:1;

    left:0;

    right:0;

    bottom:17px;

    text-align:center;

    color:rgba(121,85,72,.28);

    font-family:
        Arial,
        sans-serif;

    font-size:13px;

    font-weight:bold;

    letter-spacing:1px;

}


/* =========================
   SHARE BUTTON
========================= */

.share{

    display:block;

    width:100%;

    max-width:600px;

    margin:18px auto 0;

    padding:15px 20px;

    border:0;

    border-radius:30px;

    background:
        linear-gradient(
            135deg,
            #ff9800,
            #e65100
        );

    color:#fff;

    font-size:17px;

    font-weight:bold;

    box-shadow:
        0 8px 22px
        rgba(230,81,0,.28);

    cursor:pointer;

}


.share:active{

    transform:scale(.97);

}


/* =========================
   MOBILE
========================= */

@media(max-width:380px){

    body{

        padding:10px;

    }

    .poster{

        padding:35px 24px;

        border-radius:25px;

    }

    .quote{

        font-size:19px;

        line-height:1.75;

    }

    .author{

        font-size:16px;

    }

}


/* =========================
   LOADING
========================= */

.loading{

    opacity:.65;

    pointer-events:none;

}

</style>


<!-- html2canvas -->

<script
src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
</script>


</head>


<body>


<!-- =========================
     POSTER
========================= -->

<div
    id="poster"
    class="poster">


    <div class="label">

        🌿 सत्यानुसरण

    </div>


    <p class="quote">

        <span class="quote-mark">“</span>

        सर्वप्रथम हमें दुर्बलता के विरुद्ध
        युद्ध करना होगा।
        साहसी बनना होगा,
        वीर बनना होगा।

        <span class="quote-mark">”</span>

    </p>


    <div class="author">

        — श्री श्री ठाकुर

    </div>


    <div class="watermark">

        AnukulBhajanMala

    </div>


</div>


<!-- =========================
     SHARE BUTTON
========================= -->

<button
    id="shareButton"
    class="share"
    onclick="sharePoster()">

    ↗️ वचन Poster Share करें

</button>


<script>


/* =================================
   SEND DATA TO NIOTRON
================================= */

function sendToNiotron(data){

    try{

        var json =
            JSON.stringify(data);


        console.log(
            "Niotron JSON:",
            json
        );


        /*
         * Niotron / App Inventor
         * WebViewer bridge
         */

        if(
            window.AppInventor &&
            typeof
            window.AppInventor
            .setWebViewString
            === "function"
        ){

            window.AppInventor
                .setWebViewString(json);

            return true;

        }


        /*
         * Alternative bridge
         */

        if(
            window.Niotron &&
            typeof
            window.Niotron
            .setWebViewString
            === "function"
        ){

            window.Niotron
                .setWebViewString(json);

            return true;

        }


        /*
         * Bridge नहीं मिला
         */

        console.log(
            "Niotron WebView bridge not found"
        );

        return false;

    }

    catch(error){

        console.log(
            "Send Error:",
            error
        );

        return false;

    }

}


/* =================================
   SHARE POSTER
================================= */

async function sharePoster(){

    var button =
        document.getElementById(
            "shareButton"
        );


    try{

        /*
         * Button disable
         */

        button.disabled = true;

        button.classList.add(
            "loading"
        );

        button.innerText =
            "⏳ Poster तैयार हो रहा है...";


        /*
         * Poster element
         */

        var poster =
            document.getElementById(
                "poster"
            );


        if(!poster){

            throw new Error(
                "Poster element नहीं मिला"
            );

        }


        /*
         * html2canvas loaded है?
         */

        if(
            typeof html2canvas
            !== "function"
        ){

            throw new Error(
                "html2canvas library load नहीं हुई"
            );

        }


        /*
         * Poster → Canvas
         *
         * scale 4 =
         * High resolution
         */

        var canvas =
            await html2canvas(

                poster,

                {

                    scale:2,

                    backgroundColor:
                        "#fffef9",

                    useCORS:true,

                    allowTaint:false,

                    logging:false,

                    imageTimeout:15000

                }

            );


        /*
         * Canvas → JPEG Base64
         */

        var dataURL =
            canvas.toDataURL(
                "image/jpeg",
                0.95
            );


        /*
         * Prefix remove
         */

        var base64 =
            dataURL.replace(
                /^data:image\/jpeg;base64,/,
                ""
            );


        /*
         * Check Base64
         */

        if(
            !base64 ||
            base64.length < 100
        ){

            throw new Error(
                "Base64 image generate नहीं हुई"
            );

        }


        /*
         * JSON
         */

        var data = {

            ACTION:
                "SHARE_POSTER",

            IMAGE:
                base64,

            TEXT:
                "सत्यानुसरण — श्री श्री ठाकुर"

        };


        /*
         * Niotron भेजें
         */

        var sent =
            sendToNiotron(data);


        if(!sent){

            throw new Error(
                "Niotron WebView bridge उपलब्ध नहीं है"
            );

        }


        /*
         * Button वापस normal
         */

        button.innerText =
            "✅ Poster तैयार है";



        /*
         * थोड़ी देर बाद
         * वापस button
         */

        setTimeout(

            function(){

                button.disabled =
                    false;

                button.classList.remove(
                    "loading"
                );

                button.innerText =
                    "↗️ वचन Poster Share करें";

            },

            2000

        );


    }

    catch(error){

        console.log(
            "Poster Error:",
            error
        );


        /*
         * Error भी Niotron
         * भेजें
         */

        sendToNiotron({

            ACTION:
                "ERROR",

            IMAGE:
                "",

            TEXT:
                String(error)

        });


        button.disabled =
            false;

        button.classList.remove(
            "loading"
        );

        button.innerText =
            "❌ फिर से Share करें";

    }

}

</script>


</body>

</html>

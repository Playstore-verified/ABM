<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>सत्यानुसरण Poster</title>

<style>
*{
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
}

body{
    margin:0;
    padding:15px;
    background:linear-gradient(135deg,#fff8e7,#ffe0b2);
    font-family:"Noto Serif Devanagari",serif;
}

.poster{
    width:100%;
    max-width:600px;
    aspect-ratio:1/1;
    margin:auto;
    position:relative;
    overflow:hidden;

    background:
    linear-gradient(145deg,#fffdf5,#fff0d0);

    border:5px solid #8d3b00;
    border-radius:28px;

    padding:35px 25px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    box-shadow:
    0 10px 30px rgba(0,0,0,.25);
}

.poster:before{
    content:"";
    position:absolute;
    inset:12px;
    border:2px solid #d68b00;
    border-radius:20px;
    pointer-events:none;
}

.quote{
    position:relative;
    z-index:2;

    text-align:center;

    font-size:clamp(24px,5vw,42px);
    line-height:1.65;

    font-weight:bold;
    color:#302015;
}

.author{
    position:relative;
    z-index:2;

    margin-top:25px;

    font-size:22px;
    font-weight:bold;
    color:#9b3d00;
}

.share{
    display:block;
    width:100%;
    max-width:600px;

    margin:18px auto 0;

    padding:15px;

    border:0;
    border-radius:30px;

    background:linear-gradient(135deg,#ff9800,#e65100);

    color:white;

    font-size:18px;
    font-weight:bold;

    box-shadow:0 8px 20px rgba(230,81,0,.25);
}
</style>

<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>

<body>

<div id="poster" class="poster">

    <div class="quote">
        सर्वप्रथम हमें दुर्बलता के विरुद्ध
        युद्ध करना होगा। साहसी बनना
        होगा, वीर बनना होगा।
    </div>

    <div class="author">
        — श्रीश्रीठाकुर
    </div>

</div>

<button class="share" onclick="sharePoster()">
    ↗️ वचन Poster Share करें
</button>


<script>

/* ----------------------------------
   Niotron WebView String
---------------------------------- */

function sendToNiotron(data){

    try{

        var json = JSON.stringify(data);

        console.log("Sending to Niotron:");
        console.log(json);

        /*
          IMPORTANT:
          Niotron / App Inventor WebView
          JavaScript bridge
        */

        if(
            window.AppInventor &&
            typeof window.AppInventor.setWebViewString === "function"
        ){

            window.AppInventor.setWebViewString(json);

        }

        /*
          कुछ WebView implementations में
          यह bridge उपलब्ध हो सकता है।
        */

        else if(
            window.Niotron &&
            typeof window.Niotron.setWebViewString === "function"
        ){

            window.Niotron.setWebViewString(json);

        }

        else{

            console.log("Niotron bridge not found");

        }

    }
    catch(error){

        console.log("JSON Error:",error);

    }

}


/* ----------------------------------
   Share Poster
---------------------------------- */

async function sharePoster(){

    try{

        var poster = document.getElementById("poster");

        /*
          Poster को image में convert करें
        */

        var canvas = await html2canvas(poster,{

            scale:2,

            backgroundColor:"#fffdf5",

            useCORS:true,

            logging:false

        });


        /*
          JPEG Base64 बनाएं
        */

        var imageBase64 =
            canvas.toDataURL("image/jpeg",0.82);


        /*
          data:image/jpeg;base64,
          हटाकर केवल Base64 भेजें
        */

        imageBase64 =
            imageBase64.replace(
                /^data:image\/jpeg;base64,/,
                ""
            );


        /*
          JSON
        */

        var data = {

            ACTION:"SHARE_POSTER",

            IMAGE:imageBase64,

            TEXT:"सत्यानुसरण — श्रीश्रीठाकुर"

        };


        /*
          Niotron को भेजें
        */

        sendToNiotron(data);


    }
    catch(error){

        console.log("Poster Error:",error);

    }

}


/*
  TEST BUTTON
  Page load होने पर कुछ नहीं भेजेगा।
*/

</script>

</body>
  </html>

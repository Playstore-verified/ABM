<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,
maximum-scale=1.0,user-scalable=no">

<title>सत्यानुसरण Poster</title>

<style>

*{
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

body{
    margin:0;
    padding:15px;
    background:linear-gradient(135deg,#fff8e1,#ffe0b2);
    font-family:"Noto Serif Devanagari",
                "Nirmala UI",
                serif;
}

.wrapper{
    max-width:520px;
    margin:auto;
}

.poster{
    width:100%;
    aspect-ratio:1/1;

    background:linear-gradient(
        145deg,
        #fffdf7,
        #fff0c9
    );

    border:5px solid #8d4b18;
    border-radius:28px;

    padding:35px 28px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    box-shadow:
    0 12px 30px rgba(80,40,0,.25);

    position:relative;
}

.poster:before{
    content:"";
    position:absolute;
    inset:12px;

    border:2px solid #d89b32;
    border-radius:20px;
}

.quote{
    position:relative;
    z-index:2;

    font-size:clamp(22px,5vw,32px);

    line-height:1.75;

    font-weight:bold;

    color:#3e2723;
}

.author{
    position:relative;
    z-index:2;

    margin-top:22px;

    font-size:20px;

    font-weight:bold;

    color:#9b4215;
}

.share{
    width:62px;
    height:62px;

    margin:22px auto 0;

    border:0;

    border-radius:50%;

    background:linear-gradient(
        135deg,
        #ff9800,
        #e65100
    );

    color:white;

    font-size:28px;

    box-shadow:
    0 7px 18px rgba(230,81,0,.35);
}

.share:active{
    transform:scale(.92);
}

.footer{
    text-align:center;

    margin-top:15px;

    font-size:14px;

    color:#6d4c41;
}

</style>

</head>

<body>

<div class="wrapper">

    <!-- POSTER -->

    <div id="poster" class="poster">

        <div class="quote">
            सर्वप्रथम हमें दुर्बलता के विरुद्ध
            युद्ध करना होगा।
            साहसी बनना होगा,
            वीर बनना होगा।
        </div>

        <div class="author">
            — श्रीश्रीठाकुर
        </div>

    </div>


    <!-- SHARE -->

    <button
        onclick="testNiotron()"
        id="shareButton"
        class="share">

        ↗

    </button>


    <div class="footer">
        सत्यानुसरण • श्रीश्रीठाकुर
    </div>

</div>


<script>
function testNiotron(){

    var data = {
        ACTION: "SHARE_POSTER",
        IMAGE: "TEST_IMAGE_123",
        TEXT: "सत्यानुसरण — श्रीश्रीठाकुर"
    };

    var json = JSON.stringify(data);

    if (
        window.Niotron &&
        typeof window.Niotron.setWebViewString === "function"
    ) {

        window.Niotron.setWebViewString(json);

    } else {

        alert("Niotron JavaScript bridge नहीं मिला");

    }
}
/* end on button onclick*/
/* =====================================================
   NIOTRON
===================================================== */

function sendNiotron(data){

    var json =
        JSON.stringify(data);

    console.log("NIOTRON JSON:",json);


    /*
      Niotron / App Inventor WebViewer bridge
    */

    if(
        window.AppInventor &&
        typeof window.AppInventor
        .setWebViewString === "function"
    ){

        window.AppInventor
        .setWebViewString(json);

        return true;
    }


    /*
      अगर bridge उपलब्ध नहीं है
    */

    console.log(
        "AppInventor bridge not found"
    );

    return false;
}


/* =====================================================
   CREATE SVG POSTER
===================================================== */

function createSVG(){

    var svg = `
<svg xmlns="http://www.w3.org/2000/svg"
     width="1080"
     height="1080"
     viewBox="0 0 1080 1080">

<defs>

    <linearGradient
        id="bg"
        x1="0"
        y1="0"
        x2="1"
        y2="1">

        <stop
            offset="0%"
            stop-color="#fffdf7"/>

        <stop
            offset="100%"
            stop-color="#fff0c9"/>

    </linearGradient>

</defs>


<!-- Background -->

<rect
    width="1080"
    height="1080"
    fill="url(#bg)"/>


<!-- Outer Border -->

<rect
    x="25"
    y="25"
    width="1030"
    height="1030"
    rx="55"
    fill="none"
    stroke="#8d4b18"
    stroke-width="18"/>


<!-- Inner Border -->

<rect
    x="55"
    y="55"
    width="970"
    height="970"
    rx="40"
    fill="none"
    stroke="#d89b32"
    stroke-width="5"/>


<!-- Quote -->

<text
    x="540"
    y="400"
    text-anchor="middle"
    font-family="Noto Serif Devanagari, Nirmala UI, serif"
    font-size="62"
    font-weight="bold"
    fill="#3e2723">

    <tspan x="540" dy="0">
        सर्वप्रथम हमें दुर्बलता के विरुद्ध
    </tspan>

    <tspan x="540" dy="100">
        युद्ध करना होगा।
    </tspan>

    <tspan x="540" dy="100">
        साहसी बनना होगा,
    </tspan>

    <tspan x="540" dy="100">
        वीर बनना होगा।
    </tspan>

</text>


<!-- Author -->

<text
    x="540"
    y="850"
    text-anchor="middle"
    font-family="Noto Serif Devanagari, Nirmala UI, serif"
    font-size="48"
    font-weight="bold"
    fill="#9b4215">

    — श्रीश्रीठाकुर

</text>


<!-- Footer -->

<text
    x="540"
    y="960"
    text-anchor="middle"
    font-family="Noto Serif Devanagari, Nirmala UI, serif"
    font-size="28"
    fill="#795548">

    सत्यानुसरण

</text>

</svg>
`;

    return svg;
}


/* =====================================================
   SVG → PNG BASE64
===================================================== */

function generatePNG(){

    return new Promise(function(resolve,reject){

        try{

            var svg =
                createSVG();


            var blob =
                new Blob(
                    [svg],
                    {
                        type:"image/svg+xml"
                    }
                );


            var url =
                URL.createObjectURL(blob);


            var img =
                new Image();


            img.onload =
            function(){

                try{

                    var canvas =
                        document.createElement(
                            "canvas"
                        );


                    canvas.width =
                        1080;

                    canvas.height =
                        1080;


                    var ctx =
                        canvas.getContext(
                            "2d"
                        );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        1080,
                        1080
                    );


                    var png =
                        canvas.toDataURL(
                            "image/png"
                        );


                    URL.revokeObjectURL(
                        url
                    );


                    /*
                      data:image/png;base64,
                      हटाकर केवल Base64
                    */

                    var base64 =
                        png.split(",")[1];


                    if(
                        !base64 ||
                        base64.length < 100
                    ){

                        reject(
                            "Base64 generate नहीं हुई"
                        );

                        return;
                    }


                    resolve(base64);

                }
                catch(error){

                    reject(error);

                }

            };


            img.onerror =
            function(){

                reject(
                    "SVG image load failed"
                );

            };


            img.src = url;

        }
        catch(error){

            reject(error);

        }

    });

}


/* =====================================================
   SHARE BUTTON
===================================================== */

document
.getElementById("shareButton")
.addEventListener(
    "click",
    async function(){

        try{

            /*
              पहले PNG बनाओ
            */

            var base64 =
                await generatePNG();


            console.log(
                "BASE64 LENGTH:",
                base64.length
            );


            /*
              FINAL JSON
            */

            var data = {

                ACTION:
                    "SHARE_POSTER",

                IMAGE:
                    base64,

                TEXT:
                    "सत्यानुसरण — श्रीश्रीठाकुर"

            };


            /*
              JSON Niotron को भेजो
            */

            var sent =
                sendNiotron(data);


            /*
              Browser testing
            */

            if(!sent){

                alert(
                    "Niotron WebView bridge नहीं मिला"
                );

            }

        }
        catch(error){

            console.log(
                "ERROR:",
                error
            );


            /*
              Error भी Niotron को भेजें
            */

            sendNiotron({

                ACTION:
                    "SHARE_POSTER_ERROR",

                ERROR:
                    String(error)

            });

        }

    }
);

</script>

</body>
      </html>

<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>सत्यानुसरण Poster</title>

<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-user-select:none;
    user-select:none;
}

body{
    margin:0;
    padding:15px;
    background:linear-gradient(135deg,#fff8e1,#ffe0b2);
    font-family:"Noto Serif Devanagari",
                "Nirmala UI",
                serif;
}

/* Main wrapper */

.wrapper{
    max-width:520px;
    margin:auto;
}

/* Poster */

.poster{
    width:100%;
    aspect-ratio:1/1;
    background:
      linear-gradient(145deg,#fffdf7,#fff3d6);

    border:5px solid #8d4b18;
    border-radius:28px;

    padding:35px 28px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    box-shadow:
      0 12px 30px rgba(80,40,0,.25);

    position:relative;
}

/* Decorative border */

.poster:before{
    content:"";
    position:absolute;
    inset:12px;
    border:2px solid #d89b32;
    border-radius:20px;
    pointer-events:none;
}

/* Quote */

.quote{
    position:relative;
    z-index:2;

    font-size:clamp(22px,5vw,32px);
    line-height:1.75;

    font-weight:bold;
    color:#3e2723;
}

/* Author */

.author{
    position:relative;
    z-index:2;

    margin-top:22px;

    font-size:20px;
    font-weight:bold;

    color:#9b4215;
}

/* Share button */

.share-button{

    width:62px;
    height:62px;

    border-radius:50%;

    border:none;

    margin:22px auto 0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
        135deg,
        #ff9800,
        #e65100
    );

    color:white;

    font-size:28px;

    box-shadow:
      0 7px 18px rgba(230,81,0,.35);

    cursor:pointer;

    -webkit-tap-highlight-color:transparent;
}

.share-button:active{
    transform:scale(.92);
}

/* Footer */

.footer{
    margin-top:18px;

    text-align:center;

    font-size:14px;

    color:#6d4c41;
}

/* Hide button while screenshot is being captured */

.capture-mode .share-button{
    visibility:hidden;
}

</style>

</head>

<body>

<div class="wrapper">

    <!-- ================= POSTER ================= -->

    <div id="poster" class="poster">

        <div class="quote">
            सर्वप्रथम हमें दुर्बलता के विरुद्ध
            युद्ध करना होगा।
            साहसी बनना होगा,
            वीर बनना होगा।
        </div>

        <div class="author">
            — श्रीश्रीठाकुर
        </div>

    </div>


    <!-- ================= SHARE ================= -->

    <button
        class="share-button"
        id="shareButton"
        aria-label="Share Poster">

        ↗

    </button>


    <div class="footer">
        सत्यानुसरण • श्रीश्रीठाकुर
    </div>

</div>


<script>

/* =====================================================
   NIOTRON WEBVIEW STRING
===================================================== */

function sendToNiotron(data){

    try{

        var json = JSON.stringify(data);

        /*
          Niotron / App Inventor WebViewer
        */

        if(
            window.AppInventor &&
            typeof window.AppInventor.setWebViewString === "function"
        ){

            window.AppInventor.setWebViewString(json);

        }
        else{

            /*
              Fallback
            */

            document.title = json;

        }

    }catch(error){

        console.log("Niotron error:",error);

    }

}


/* =====================================================
   SHARE POSTER
===================================================== */

document.getElementById("shareButton")
.addEventListener("click", function(){

    createPosterImage();

});


/* =====================================================
   CREATE POSTER IMAGE
===================================================== */

async function createPosterImage(){

    var poster =
        document.getElementById("poster");

    var button =
        document.getElementById("shareButton");


    try{

        /*
          Button को temporarily hide करें
        */

        document.body.classList.add("capture-mode");


        /*
          थोड़ा wait ताकि rendering complete हो
        */

        await new Promise(function(resolve){

            setTimeout(resolve,300);

        });


        /*
          html2canvas check
        */

        if(typeof html2canvas === "undefined"){

            throw new Error(
                "html2canvas library load नहीं हुई"
            );

        }


        /*
          Poster capture
        */

        var canvas = await html2canvas(
            poster,
            {

                backgroundColor:"#fffdf7",

                scale:3,

                useCORS:true,

                allowTaint:false,

                logging:false,

                imageTimeout:15000

            }
        );


        /*
          Canvas → PNG Base64
        */

        var dataURL =
            canvas.toDataURL(
                "image/png",
                1.0
            );


        /*
          Check करें
        */

        if(
            !dataURL ||
            dataURL.length < 100
        ){

            throw new Error(
                "Base64 image generate नहीं हुई"
            );

        }


        /*
          data:image/png;base64, हटाकर
          केवल Base64 भेजेंगे
        */

        var base64 =
            dataURL.split(",")[1];


        if(
            !base64 ||
            base64.length < 100
        ){

            throw new Error(
                "Base64 खाली है"
            );

        }


        /*
          यही FINAL JSON है
        */

        var result = {

            ACTION:"SHARE_POSTER",

            IMAGE:base64,

            TEXT:"सत्यानुसरण — श्रीश्रीठाकुर"

        };


        /*
          अब Niotron को भेजें
        */

        sendToNiotron(result);


    }
    catch(error){

        console.log(
            "Poster generation error:",
            error
        );


        /*
          Error भी Niotron को भेजें
        */

        sendToNiotron({

            ACTION:"SHARE_POSTER_ERROR",

            ERROR:String(error)

        });

    }
    finally{

        /*
          Button वापस दिखाएँ
        */

        document.body.classList.remove(
            "capture-mode"
        );

    }

}


/* =====================================================
   LONG PRESS / COPY PROTECTION
===================================================== */

document.addEventListener(
    "contextmenu",
    function(e){
        e.preventDefault();
    }
);

document.addEventListener(
    "selectstart",
    function(e){
        e.preventDefault();
    }
);

</script>

</body>
  </html>
